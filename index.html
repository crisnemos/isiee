<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>星际边界 | 官方预告片</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
scroll-behavior:smooth;
}

body{
font-family:'Poppins',sans-serif;
background:#050816;
color:white;
overflow-x:hidden;
}

#particles{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
z-index:-2;
}

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.85)),
url("https://images.unsplash.com/photo-1462331940025-496dfbfc7564") center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

nav{
position:fixed;
top:0;
left:0;
width:100%;
padding:20px 60px;
display:flex;
justify-content:space-between;
align-items:center;
backdrop-filter:blur(10px);
background:rgba(0,0,0,.25);
z-index:1000;
}

.logo{
font-size:28px;
font-weight:700;
color:#4fdcff;
}

nav ul{
display:flex;
gap:30px;
list-style:none;
}

nav a{
color:white;
text-decoration:none;
transition:.3s;
}

nav a:hover{
color:#4fdcff;
}

.hero-content{
max-width:900px;
padding:20px;
}

.hero h1{
font-size:6rem;
letter-spacing:8px;
text-shadow:0 0 30px #4fdcff;
}

.hero p{
margin-top:20px;
font-size:1.3rem;
color:#d8d8d8;
}

.hero-btn{
display:inline-block;
margin-top:40px;
padding:16px 40px;
background:#4fdcff;
color:black;
border-radius:50px;
font-weight:700;
text-decoration:none;
transition:.4s;
}

.hero-btn:hover{
transform:translateY(-5px);
box-shadow:0 0 25px #4fdcff;
}

.section{
padding:100px 8%;
}

.title{
text-align:center;
font-size:3rem;
margin-bottom:60px;
color:#4fdcff;
}

.movie-info{
display:grid;
grid-template-columns:1fr 1fr;
gap:50px;
align-items:center;
}

.poster{
width:100%;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.5);
}

.info-box{
font-size:1.1rem;
line-height:1.8;
}

.stats{
display:flex;
gap:20px;
margin-top:30px;
flex-wrap:wrap;
}

.stat{
background:#101827;
padding:20px;
border-radius:15px;
min-width:120px;
text-align:center;
}

.cast{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.actor{
background:#0f172a;
border-radius:20px;
overflow:hidden;
transition:.4s;
}

.actor:hover{
transform:translateY(-10px);
}

.actor img{
width:100%;
height:320px;
object-fit:cover;
}

.actor h3{
padding:20px;
}

.gallery{
columns:3 280px;
gap:15px;
}

.gallery img{
width:100%;
margin-bottom:15px;
border-radius:15px;
transition:.4s;
}

.gallery img:hover{
transform:scale(1.03);
}

.countdown{
text-align:center;
background:
linear-gradient(135deg,#07111f,#0e233d);
border-radius:25px;
padding:60px;
}

.timer{
display:flex;
justify-content:center;
gap:25px;
margin-top:30px;
flex-wrap:wrap;
}

.time-box{
background:#111827;
padding:25px;
border-radius:15px;
min-width:120px;
}

.time-box span{
display:block;
font-size:3rem;
font-weight:bold;
color:#4fdcff;
}

footer{
padding:40px;
text-align:center;
color:#999;
border-top:1px solid rgba(255,255,255,.1);
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.9);
justify-content:center;
align-items:center;
z-index:2000;
}

.modal-content{
width:80%;
max-width:1000px;
aspect-ratio:16/9;
}

.modal iframe{
width:100%;
height:100%;
}

.close{
position:absolute;
top:30px;
right:50px;
font-size:40px;
cursor:pointer;
}

@media(max-width:768px){

.hero h1{
font-size:3rem;
}

.movie-info{
grid-template-columns:1fr;
}

nav{
padding:15px 20px;
}
}
</style>
</head>

<body>

<canvas id="particles"></canvas>

<nav>
<div class="logo">STARBOUND</div>
<ul>
<li><a href="#story">剧情</a></li>
<li><a href="#cast">演员</a></li>
<li><a href="#gallery">剧照</a></li>
<li><a href="#release">上映</a></li>
</ul>
</nav>

<section class="hero">

<div class="hero-content">

<h1>星际边界</h1>

<p>
穿越银河尽头，揭开文明起源的终极秘密。
</p>

<a class="hero-btn" onclick="openTrailer()">
▶ 观看预告片
</a>

</section>

<section class="section" id="story">

<h2 class="title">电影简介</h2>

<div class="movie-info">

<img class="poster"
src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86">

<div class="info-box">

<p>
2148年，人类发现连接多个星系的“边界之门”。
探索舰队踏入未知宇宙，却意外发现一个消失数百万年的高等文明。
随着真相逐渐浮出水面，一场关乎全人类命运的战争即将来临。
</p>

<div class="stats">
<div class="stat">
<h3>类型</h3>
<p>科幻 / 冒险</p>
</div>

<div class="stat">
<h3>时长</h3>
<p>142分钟</p>
</div>

<div class="stat">
<h3>评分</h3>
<p>9.2</p>
</div>
</div>

</div>

</div>

</section>

<section class="section" id="cast">

<h2 class="title">主演阵容</h2>

<div class="cast">

<div class="actor">
<img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e">
<h3>张宇辰 饰 林泽</h3>
</div>

<div class="actor">
<img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330">
<h3>李若曦 饰 安娜</h3>
</div>

<div class="actor">
<img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d">
<h3>陈浩然 饰 凯恩</h3>
</div>

</div>

</section>

<section class="section" id="gallery">

<h2 class="title">精彩剧照</h2>

<div class="gallery">

<img src="https://images.unsplash.com/photo-1462331940025-496dfbfc7564">

<img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa">

<img src="https://images.unsplash.com/photo-1451187580459-43490279c0fa">

<img src="https://images.unsplash.com/photo-1465101046530-73398c7f28ca">

<img src="https://images.unsplash.com/photo-1451187863213-d1bcbaae3fa3">

</div>

<section class="section" id="release">

<div class="countdown">

<h2>全球上映倒计时</h2>

<div class="timer">
<div class="time-box">
<span id="days">0</span>
天
</div>

<div class="time-box">
<span id="hours">0</span>
时
</div>

<div class="time-box">
<span id="minutes">0</span>
分
</div>

<div class="time-box">
<span id="seconds">0</span>
秒
</div>
</div>

</div>

</section>

<footer>
© 2026 STARBOUND MOVIE TRAILER
</footer>

<div class="modal" id="modal">

<span class="close" onclick="closeTrailer()">✕</span>

<div class="modal-content">

<iframe
src=""
id="trailerFrame"
frameborder="0"
allowfullscreen>
</iframe>

</div>

</div>

<script>
function openTrailer(){
document.getElementById("modal").style.display="flex";
document.getElementById("trailerFrame").src=
"https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1";
}

function closeTrailer(){
document.getElementById("modal").style.display="none";
document.getElementById("trailerFrame").src="";
}

const releaseDate=new Date("2026-12-18");

function updateTimer(){

const now=new Date();
const diff=releaseDate-now;

const days=Math.floor(diff/(1000*60*60*24));
const hours=Math.floor(diff/(1000*60*60)%24);
const minutes=Math.floor(diff/(1000*60)%60);
const seconds=Math.floor(diff/1000%60);

document.getElementById("days").textContent=days;
document.getElementById("hours").textContent=hours;
document.getElementById("minutes").textContent=minutes;
document.getElementById("seconds").textContent=seconds;
}

setInterval(updateTimer,1000);
updateTimer();

const canvas=document.getElementById('particles');
const ctx=canvas.getContext('2d');

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];

for(let i=0;i<120;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2,
v:Math.random()*0.5+0.1
});
}

function animate(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#4fdcff";

particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fill();

p.y+=p.v;

if(p.y>canvas.height){
p.y=0;
p.x=Math.random()*canvas.width;
}
});

requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
